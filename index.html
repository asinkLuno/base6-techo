<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>base6-techo</title>
    <script>
      // 首帧前恢复持久化偏好，避免主题/语言闪变。
      // 键名与结构须与 src/stores/settings.ts 的 zustand persist 配置保持一致。
      (function () {
        try {
          var raw = localStorage.getItem("base6-techo:settings");
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (parsed.version !== 1) return;
          var state = parsed.state;
          var themes = ["light", "dark"];
          document.documentElement.setAttribute(
            "data-theme",
            state && themes.indexOf(state.theme) !== -1 ? state.theme : "light",
          );
          if (state && state.language) document.documentElement.lang = state.language;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
