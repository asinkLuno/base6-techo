name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TECTONIC_VERSION: 0.17.0

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
          - os: windows-2025
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download Tectonic
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          case "${{ runner.os }}" in
            Windows) archive="tectonic.zip" ;;
            *) archive="tectonic.tar.gz" ;;
          esac
          curl -fL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-${{ matrix.target }}.${archive#tectonic.}" -o "$archive"
          if [ "${{ runner.os }}" = Windows ]; then
            unzip -q "$archive"
            mv tectonic.exe "src-tauri/binaries/tectonic-${{ matrix.target }}.exe"
          else
            tar -xf "$archive"
            mv tectonic "src-tauri/binaries/tectonic-${{ matrix.target }}"
          fi

      - run: yarn install --immutable
      - run: yarn tauri build --config src-tauri/tauri.bundle.json --bundles "${{ matrix.bundles }}"

      - uses: actions/upload-artifact@v4
        with:
          name: base6-techo-${{ matrix.platform }}
          path: target/release/bundle/**
          if-no-files-found: error
