repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # vendored 第三方单文件（OpenCC 简繁转换，运行时使用）允许超过 500 KB
        exclude: ^showcase/vendor/

  - repo: local
    hooks:
      - id: mdformat
        name: mdformat
        entry: mdformat
        language: python
        additional_dependencies: ["mdformat>=0.7"]
        types: [markdown]
