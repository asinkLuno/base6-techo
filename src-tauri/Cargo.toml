[package]
name = "base6-techo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# two binaries exist (main app + desktop prewarm tool) — tauri CLI runs plain
# `cargo run`, so the default must be unambiguous
default-run = "base6-techo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "base6_techo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tectonic: pinned exactly so the Android registry patches in scripts/patch-tectonic.sh
# apply deterministically. native-tls-vendored = static OpenSSL built from source by
# the NDK (no system OpenSSL needed when cross-compiling).
tectonic = { version = "=0.16.9", features = ["native-tls-vendored"] }
# unpacks the prewarmed offline cache (src-tauri/assets/tectonic-cache.zip) on first run
zip = { version = "2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
