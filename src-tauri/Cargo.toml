[package]
name = "base6-techo"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# two binaries exist (main app + desktop prewarm tool) — tauri CLI runs plain
# `cargo run`, so the default must be unambiguous
default-run = "base6-techo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "base6_techo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 保存对话框：桌面返回文件路径，Android 走 SAF 返回 content:// URI
tauri-plugin-dialog = "2"
# Android 上向 SAF 选定的 content:// URI 写入 PDF 字节
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 解码 save_pdf_file 的建议文件名 header（前端 encodeURIComponent）
percent-encoding = "2"
# 实时编译日志：编译期间把 fd1 重定向到管道逐行捕获引擎转写（linux/android）
libc = "0.2"
# StatusBackend::report 的 err 参数类型（tectonic_errors::Error 即 anyhow::Error）
anyhow = "1"
# tectonic: pinned exactly so the Android registry patches in scripts/patch-tectonic.sh
# apply deterministically. native-tls-vendored = static OpenSSL built from source by
# the NDK (no system OpenSSL needed when cross-compiling).
tectonic = { version = "=0.16.9", features = ["native-tls-vendored"] }
# unpacks the prewarmed offline cache (public/tectonic-cache.zip -> dist/) on first run
zip = { version = "2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# 必须保持 unwind：compile::compile 用 catch_unwind 把 tectonic 内部 panic
# 转成可展示的错误。panic = "abort" 会让 catch_unwind 失效、直接杀掉整个 App。
strip = true


# 静态检查唯一来源：cargo clippy 与 rust-analyzer 都读这里。
# 源码只设 warn；`-D warnings` 只出现在 `yarn check:rust`（及 CI），
# 避免工具链升级新增 lint 时把本地 `cargo build` 变成硬失败。
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
# 组必须给负 priority，否则与下面的单条 deny 冲突
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
