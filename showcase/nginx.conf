server {
    listen 80;
    server_name _;

    index index.html;

    # 站点：Astro base=/showcase/，URL /showcase/ → dist 构建输出
    # ^~ 使其优先于下方正则缓存匹配，避免字体/图片命中错误 root
    location ^~ /showcase/ {
        alias /usr/share/nginx/html/showcase/;
        try_files $uri $uri/ =404;
    }

    # 样张图片/JSON/PDF：文件在 /examples 平级，root 指回 html/
    # ^~ 使其优先于下面的正则缓存匹配，避免误落到 showcase 根
    location ^~ /examples/ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 字体：版本化静态资源，长缓存
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片：样式可复用的样张，短缓存
    location ~* \.(?:png|jpe?g|gif|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        return 301 /showcase/;
    }
}
