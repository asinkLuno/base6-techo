server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/showcase;
    index index.html;

    # 字体/图片长缓存，index.html 不缓存以便更新即时可见
    location ~* \.(?:woff2?|png|jpe?g|gif|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 样张 JSON/PNG：文件在 /examples 平级，故 root 指回 html/
    location /examples/ {
        root /usr/share/nginx/html;
    }
}
